<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cancicio Portfolio</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!--NAVIGATION -->

    <nav class="navbar">
      <!-- CLICKABLE HOME -->
      <a href="#home" class="logo">Home</a>

      <div class="nav-links">
        <a href="#about">About Me</a>
        <a href="#quizzes">Quizzes</a>
        <a href="#activities">Activities</a>
      </div>
    </nav>

    <!--HOME -->

    <section id="home" class="home">
      <div class="home-text">
        <h1>MY PORTFOLIO</h1>

        <p>This is my personal portfolio for School Activities and Quizzes.</p>
      </div>
    </section>

    <!-- ABOUT ME-->

    <section id="about" class="about">
      <!-- PHOTO -->
      <div class="about-photo">
        <img src="me.jfif" alt="Photo of John Mar F. Cancicio" />
      </div>

      <!-- INFORMATION -->
      <div class="about-text">
        <h2>About Me</h2>

        <p>
          <b>Hello, I'm John Mar F. Cancicio.</b>
        </p>

        <p>19 years old from BSCS-3C.</p>
      </div>
    </section>

    <!--QUIZZES -->

    <section id="quizzes" class="quiz-pictures">
      <h2>Quizzes</h2>

      <div class="gallery">
        <!-- QUIZ IMAGES -->
        <img src="quiz1.jfif" alt="Quiz 1" onclick="openImage(this.src)" />
        <img src="quiz1(2).jfif" alt="Quiz 1" onclick="openImage(this.src)" />
        
        <img src="QUIZ2.jpg" alt="Quiz 2" onclick="openImage(this.src)" />

        <img src="QUIZ3.jpg" alt="Quiz 3" onclick="openImage(this.src)" />
      </div>
    </section>

    <!--ACTIVITIES-->

    <section id="activities" class="activities">
      <h2>Activities</h2>

      <div class="gallery">
        <!-- ACTIVITY IMAGES -->
        <img src="ACTIVITY1.jpg" alt="Activity 1" onclick="openImage(this.src)" />

        <img src="ACTIVITY2.jpg" alt="Activity 2" onclick="openImage(this.src)" />

        <img src="ACTIVITY3.jpg" alt="Activity 3" onclick="openImage(this.src)" />
      </div>
    </section>

    <!-- IMAGE VIEWER -->

    <div id="imageViewer" class="image-viewer" onclick="closeImage()">
      <span class="close-button">&times;</span>

      <img id="fullImage" src="" alt="Full Image" onclick="event.stopPropagation()" />
    </div>

    <!--FOOTER-->

    <footer>
      <p>© My Portfolio</p>
    </footer>

    <!-- IMAGE VIEWER SCRIPT -->

    <script>
      function openImage(imageSource) {
        document.getElementById("imageViewer").style.display = "flex";
        document.getElementById("fullImage").src = imageSource;
      }

      function closeImage() {
        document.getElementById("imageViewer").style.display = "none";
      }
    </script>

  </body>
</html>
